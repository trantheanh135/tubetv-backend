apiVersion: v1
kind: Namespace
metadata:
  name: tubetv
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: tubetv
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30891
---
# The image tag is rewritten by .github/workflows/backend.yml after a successful build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tubetv
spec:
  replicas: 1
  # Keep the old pod serving until the new one is ready; the control plane here is slow to recover.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/trantheanh135/tubetv-backend:fe2122d83bae80873851cd8a715c0cd889e5e0e2
          ports:
            - containerPort: 8080
          env:
            - name: MAX_CONCURRENCY
              value: "3"
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          resources:
            requests: {memory: 256Mi, cpu: 250m}
            limits: {memory: 1Gi, cpu: 2000m}
