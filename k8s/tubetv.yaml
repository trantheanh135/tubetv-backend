apiVersion: v1
kind: Namespace
metadata:
  name: tubetv
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: tubetv
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30891
---
# The image tag is rewritten by .github/workflows/backend.yml after a successful build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tubetv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/trantheanh135/tubetv-backend:2e6a841b93b79b37e28f304b78247def617777a5
          ports:
            - containerPort: 8080
          env:
            - name: MAX_CONCURRENCY
              value: "3"
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          resources:
            requests: {memory: 256Mi, cpu: 500m}
            limits: {memory: 1Gi, cpu: 3000m}
