apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tubetv-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/trantheanh135/tubetv-backend
    targetRevision: main
    path: k8s
    directory:
      exclude: argocd-application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tubetv
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
