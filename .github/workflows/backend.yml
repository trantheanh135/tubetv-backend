name: Backend — test, build image, deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  schedule:
    # YouTube breaks yt-dlp every few weeks; a nightly rebuild pulls the newest release.
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  group: k8s-deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tubetv-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (no cache, so yt-dlp is always the latest release)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Pin the new image in k8s/
        run: |
          sed -i "s|image: .*tubetv-backend.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/tubetv.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/tubetv.yaml
          git commit -m "Deploy backend ${GITHUB_SHA::7}" || exit 0
          git push
